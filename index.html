<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Revival - Login System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .login-container {
            background: #121214;
            border: 2px solid #322124;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .logo span {
            color: #e51c44;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #202024;
            border: 1px solid #322124;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border-color: #e51c44;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #e51c44;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #b81434;
        }

        .status-box {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .status-title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .status-title span {
            color: #4cd67d;
        }

        .profile-data {
            background: #202024;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .profile-data span {
            color: #e51c44;
            font-weight: bold;
        }

        .error-msg {
            color: #e51c44;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div id="login-form">
            <div class="logo">Project <span>Revival</span></div>
            
            <div class="input-group">
                <label>E-mail do Jogador</label>
                <input type="email" id="email" placeholder="seu-email@provedor.com" required>
            </div>

            <button class="btn" id="login-btn" onclick="executarLogin()">Autenticar</button>
            <div class="error-msg" id="error-text"></div>
        </div>

        <div id="status-screen" class="status-box">
            <div class="status-title">● <span>CONECTADO</span></div>
            <p style="font-size: 11px; color: #888; margin-bottom: 20px; text-transform: uppercase;">Perfil sincronizado com o servidor</p>
            
            <div class="profile-data">
                Jogador: <span id="prof-nick">Carregando...</span><br>
                Nível: <span id="prof-level">1</span><br>
                Ouro: <span id="prof-gold">0</span><br>
                Diamantes: <span id="prof-diamonds">0</span>
            </div>

            <p style="color: #4cd67d; font-size: 13px; font-weight: bold;">Iniciando o jogo automaticamente...</p>
        </div>
    </div>

    <script>
        function executarLogin() {
            const emailInput = document.getElementById('email').value;
            const errorText = document.getElementById('error-text');
            const loginBtn = document.getElementById('login-btn');

            if (!emailInput) {
                errorText.innerText = "Por favor, digite seu e-mail.";
                errorText.style.display = "block";
                return;
            }

            errorText.style.display = "none";
            loginBtn.innerText = "Aguarde...";
            loginBtn.disabled = true;

            // Faz a requisição direto para a API do seu server.py
            fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: emailInput })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Preenche a tela de informações do player
                    document.getElementById('prof-nick').innerText = data.profile.nick;
                    document.getElementById('prof-level').innerText = data.profile.nivel;
                    document.getElementById('prof-gold').innerText = data.profile.ouro;
                    document.getElementById('prof-diamonds').innerText = data.profile.diamantes;

                    // Alterna as telas do painel
                    document.getElementById('login-form').style.display = "none";
                    document.getElementById('status-screen').style.display = "block";

                    // Executa a rotina de fechamento automático após 2 segundos (tempo do jogador ler o sucesso)
                    setTimeout(() => {
                        finalizarEEntrarNoJogo();
                    }, 2000);

                } else {
                    loginBtn.innerText = "Autenticar";
                    loginBtn.disabled = false;
                    errorText.innerText = data.msg || "Erro ao conectar.";
                    errorText.style.display = "block";
                }
            })
            .catch(err => {
                loginBtn.innerText = "Autenticar";
                loginBtn.disabled = false;
                errorText.innerText = "Servidor offline ou instável.";
                errorText.style.display = "block";
                console.error(err);
            });
        }

        function finalizarEEntrarNoJogo() {
            // Gatilho 1: Fecha a WebView se o APK suportar o comando padrão do Android
            if (window.Android) {
                if (typeof window.Android.closeInterface === 'function') {
                    window.Android.closeInterface();
                    return;
                }
                if (typeof window.Android.hide === 'function') {
                    window.Android.hide();
                    return;
                }
            }

            // Gatilho 2: Tenta fechar a janela do navegador via script clássico
            if (typeof window.close === 'function') {
                window.close();
            }

            // Gatilho 3: Envia uma URL limpa caso o APK use um interceptador de páginas vazias para fechar
            window.location.href = "about:blank";
        }
    </script>
</body>
</html>
